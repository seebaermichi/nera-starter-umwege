# The widths the theme's image sizes are made for (the cover runs the full
# page width, up to 2400 px at 2x). The post image is rendered eagerly through
# the post-media seam.
eager_first: false
widths: [480, 800, 1600, 2400]
# The theme writes no og:image tag, so the 1200×630 crop would go unused.
og: false
